apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: semantic-layer-demo
spec:
  routes:
    - kind: Rule
      match: Host(`demo.maartenor.org`)
      middlewares:
        - name: redirect-https
      priority: 105
      services:
        - name: semantic-layer-demo
          port: 80
  tls:
    secretName: demo-maartenor-org-tls
