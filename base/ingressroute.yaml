apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: semantic-layer-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
  labels:
    app: semantic-layer-demo
    environment: dev
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`semantic-layer-demo-dev.maartenor.org`)
      middlewares:
        - name: redirect-https
      priority: 100
      services:
        - name: semantic-layer-demo
          port: 80
  tls:
    secretName: semantic-layer-demo-dev-tls
